{% extends "index.html" %}

{% component list_tag_posts(pages: array, tag_name: string = "") %}
{% if tag_name %}
    <h1 class="page-header">
        Entries tagged :: {{ tag_name }}
    </h1>
{% else %}
    <h1 class="page-header">
        All articles
    </h1>
{% endif %}

<main class="post-list">
    {{<post.list_posts pages={pages} />}}
</main>
{% endcomponent list_tag_posts %}

{% block main_content %}
    {{<list_tag_posts pages={term.pages} tag_name={term.name} />}}
{% endblock main_content %}
