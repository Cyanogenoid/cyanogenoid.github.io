# The URL the site will be built for
base_url = "https://www.cyanogenoid.com"

theme = "apollo"
default_language = "en"
title = "Cyanogenoid"
description = "Research scientist at Samsung SAIT AI Lab, Montreal. Deep learning with structured objects."

taxonomies = [
    { name = "tags" },
]

compile_sass = true
minify_html = true
build_search_index = true

[search]
include_title = true
include_description = true
include_path = true
include_content = true
index_format = "elasticlunr_json"

# Syntax highlighting (Giallo)
[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"
error_on_missing_language = false

[extra]
theme = "toggle"
toc = false
fancy_code = false
dynamic_note = false
mathjax = false
socials = []
stylesheets = ["custom.css"]

menu = [
    { name = "about me", url = "/" },
    { name = "papers", url = "/papers" },
    { name = "fun", url = "/fun" },
]

[extra.analytics]
enabled = false
